name: release

# Every tag gets a GitHub release with the printed parts as one zip. The firmware workflow adds
# the UF2 files to the same release. Only tags of the form v1.2.3 are full releases, every other
# tag (test-print-1, v0.1.0-rc1) is marked as a pre-release.
on:
  push:
    tags:
      - "*"

jobs:
  print-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack the printed parts
        run: python3 scripts/release_zip.py "$GITHUB_REF_NAME" --out dist
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then pre="--prerelease"; fi
          # the firmware workflow may have created the release in the meantime
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $pre \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
