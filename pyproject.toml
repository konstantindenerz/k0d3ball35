[project]
name = "k0d3ball36"
version = "0.1.0"
description = "Wireless 36-key low profile split keyboard with a 25 mm trackball"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "kiutils>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
markers = [
  "kicad: tests that need kicad-cli",
]
