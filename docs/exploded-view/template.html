<script type="module">
import * as THREE from 'three';

const D = /*__LAYOUT_DATA__*/;

// ---------- helpers ----------
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const col = (hex) => new THREE.Color(hex);
const PCB_T = D.pcb_thickness;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function outlineShape(points, holes = []) {
  const s = new THREE.Shape();
  points.forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y)));
  s.closePath();
  for (const h of holes) {
    const p = new THREE.Path();
    if (h.points) { h.points.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); p.closePath(); }
    else p.absarc(h.x, h.y, h.r, 0, Math.PI * 2, true);
    s.holes.push(p);
  }
  return s;
}
// Extrude a layout-plane shape downwards from `top` by `depth` (layout y -> world Z, height -> world Y)
function slab(shape, depth, top, mat) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  const m = new THREE.Mesh(g, mat);
  m.rotation.x = Math.PI / 2;
  m.position.y = top;
  return m;
}
function box(w, h, d, mat, x, y, z, rotDeg = 0) {   // w along X, h along Y (height), d along Z
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = THREE.MathUtils.degToRad(rotDeg);
  return m;
}
function cyl(r, h, mat, x, y, z, rt = r, open = false) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, r, h, 64, 1, open), mat);
  m.position.set(x, y, z);
  return m;
}
// grow or shrink a layout polygon radially about its centroid (placeholder shells only)
// local key offset (lx, ly) rotated by the KiCad rotation (positive = counter-clockwise on screen)
function keyLocal(k, lx, ly) {
  const t = THREE.MathUtils.degToRad(k.rot);
  return { x: k.x + lx * Math.cos(t) + ly * Math.sin(t), z: k.y - lx * Math.sin(t) + ly * Math.cos(t) };
}

// ---------- materials ----------
const M = {
  case: new THREE.MeshStandardMaterial({ color: col('#D8CDBB'), roughness: .9 }),
  caseGhost: new THREE.MeshStandardMaterial({ color: col('#D8CDBB'), roughness: .9, transparent: true, opacity: .55 }),
  pcb: new THREE.MeshStandardMaterial({ color: col('#2E5A3B'), roughness: .6 }),
  pcbEdge: new THREE.MeshStandardMaterial({ color: col('#C9A24A'), roughness: .5, metalness: .4 }),
  black: new THREE.MeshStandardMaterial({ color: col('#2A2A2C'), roughness: .7 }),
  socket: new THREE.MeshStandardMaterial({ color: col('#3B3B3F'), roughness: .8 }),
  diode: new THREE.MeshStandardMaterial({ color: col('#1B1B1D'), roughness: .5 }),
  metal: new THREE.MeshStandardMaterial({ color: col('#B9BCC2'), roughness: .35, metalness: .8 }),
  ctrl: new THREE.MeshStandardMaterial({ color: col('#1C2538'), roughness: .5 }),
  battery: new THREE.MeshStandardMaterial({ color: col('#8E9CB0'), roughness: .5 }),
  battery2: new THREE.MeshStandardMaterial({ color: col('#7B8BA3'), roughness: .5, transparent: true, opacity: .7 }),
  switchBody: new THREE.MeshStandardMaterial({ color: col('#EDE8DF'), roughness: .8 }),
  stem: new THREE.MeshStandardMaterial({ color: col('#C8402C'), roughness: .6 }),
  cap: new THREE.MeshStandardMaterial({ color: col('#F4F0E7'), roughness: .75 }),
  capGrey: new THREE.MeshStandardMaterial({ color: col('#CFCAC0'), roughness: .75 }),
  capThumb: new THREE.MeshStandardMaterial({ color: col('#EF7F3A'), roughness: .7 }),
  cradle: new THREE.MeshStandardMaterial({ color: col('#CFC5B3'), roughness: .85 }),
  ball: new THREE.MeshStandardMaterial({ color: col('#FFFFFF'), roughness: .25 }),
  sensor: new THREE.MeshStandardMaterial({ color: col('#1E4A6B'), roughness: .5 }),
  lens: new THREE.MeshStandardMaterial({ color: col('#9FB9C9'), roughness: .2, transparent: true, opacity: .8 }),
  plate: new THREE.MeshStandardMaterial({ color: col('#D8CDBB'), roughness: .9, transparent: true, opacity: .6 }),
  rim: new THREE.MeshBasicMaterial({ color: col('#E8762E'), wireframe: true, transparent: true, opacity: .35 }),
  bumper: new THREE.MeshStandardMaterial({ color: col('#2A2A2C'), roughness: 1 }),
  bearing: new THREE.MeshStandardMaterial({ color: col('#F2F2F2'), roughness: .2 }),
};
for (const m of Object.values(M)) m.side = THREE.DoubleSide;

// ---------- scene ----------
const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 1, 2000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8370, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(80, 160, 120); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, .5); fill.position.set(-120, 60, -80); scene.add(fill);

const root = new THREE.Group();          // mirrored (scale.x = -1) for the left half
scene.add(root);

// Layer registry: { name, group, explode (world Y offset at full explode), color, anchor }
let layers = [];
let H = D.halves.right;
const target = new THREE.Vector3();
const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const FLOOR_Z = -11.6;     // case floor: sensor board underside in the pocket, same under the whole half (placeholder)

function layer(name, explode, color, anchor) {
  const g = new THREE.Group();
  g.userData = { name, explode, baseY: 0 };
  root.add(g);
  layers.push({ name, group: g, explode, color, anchor });
  return g;
}

function build(half) {
  H = D.halves[half];
  while (root.children.length) { const c = root.children.pop(); c.traverse((o) => { if (o.geometry) o.geometry.dispose(); }); }
  layers = [];
  root.scale.x = half === 'left' ? -1 : 1;
  const B = H.bounds, ball = H.ball, S = H.stack, c = D.controller;
  const bx = ball ? ball.x : 0, bz = ball ? ball.y : 0;
  const ol = outlineShape(H.outline);
  target.set((B.min_x + B.max_x) / 2, 4, (B.min_y + B.max_y) / 2 + 2);
  clipPlane.constant = ball ? bz : 60;

  // --- case bottom (concept) ---
  {
    const g = layer('Case bottom (concept)', -34, '#D8CDBB', { x: B.min_x + 10, y: -14, z: B.max_y - 10 });
    const floorTop = FLOOR_Z - 0.2;
    const floorShape = outlineShape(H.outline_case);
    g.add(slab(floorShape, 2.0, floorTop, M.case));
    const outer = outlineShape(H.outline_case, [{ points: H.outline }]);
    g.add(slab(outer, 5.0 - floorTop, 5.0, M.caseGhost));   // walls: 5 mm above the PCB down to the floor
    if (ball) {
      // pocket: floor disk, wall ring (2 mm) from the floor to the cup rim, the PCB-side open where the PCB meets the notch
      g.add(cyl(ball.pocket_d / 2 + 2, 2.0, M.case, bx, floorTop - 1.0, bz));
      const ring = new THREE.Mesh(new THREE.RingGeometry(ball.pocket_d / 2, ball.pocket_d / 2 + 2, 64), M.caseGhost);
      const wall = cyl(ball.pocket_d / 2 + 2, S.rim_z - floorTop, M.caseGhost, bx, (S.rim_z + floorTop) / 2, bz, ball.pocket_d / 2 + 2, true);
      g.add(wall);
      ring.rotation.x = -Math.PI / 2; ring.position.set(bx, S.rim_z, bz); g.add(ring);
    }
    const bumpers = [[B.min_x + 12, B.min_y + 8], [B.max_x - 10, B.min_y + 16], [B.min_x + 14, B.max_y - 18], [B.max_x - 14, B.max_y - 12]];
    for (const [x, z] of bumpers) g.add(cyl(5, 1.5, M.bumper, x, floorTop - 2.75, z));
  }
  // --- battery in the controller box (702025, right half) ---
  if (ball) {
    const g = layer('Battery 702025 (case pocket)', -22, '#7B8BA3', { x: c.x + 2, y: -6, z: c.y + 38 });
    g.add(box(19.7, 6.7, 27, M.battery2, c.x + 3, -PCB_T - 2.2 - 3.35, c.y + 36));
  }
  // --- sensor board + lens (on the case floor in the pocket) ---
  if (ball) {
    const g = layer('Sensor board PMW3610', -16, '#1E4A6B', { x: bx + 16, y: -11, z: bz });
    const sb = ball.sensor_board;
    g.add(box(sb.width, 1.6, sb.height, M.sensor, bx, S.sensor_pcb_plane_z - 0.8, bz));       // board, lens side up at the housing face
    g.add(box(21.5, 3.4, 11.4, M.lens, bx, S.sensor_pcb_plane_z + 1.7, bz));                  // LM18-LSI lens block above the board
    g.add(box(8.6, 2.0, 4.8, M.metal, bx + 6, S.sensor_pcb_plane_z - 1.6 - 1.0, bz - 9));     // FPC connector on the floor side
  }
  // --- cradle (pocket mount) ---
  if (ball) {
    const g = layer('Trackball cradle (pocket mount)', -8, '#CFC5B3', { x: bx - 18, y: 4, z: bz });
    const housing = new THREE.Mesh(new THREE.BoxGeometry(S.housing_x, S.housing_top_z - S.floor_z, S.housing_y), M.cradle);
    housing.position.set(bx, (S.housing_top_z + S.floor_z) / 2, bz); g.add(housing);
    for (const sx of [-1, 1]) g.add(cyl(3.5, 2.0, M.cradle, bx + sx * (S.footprint_x / 2 - 3.5), S.floor_z + 1.0, bz));   // screw ears
    g.add(cyl(S.cup_outer_d / 2, S.rim_z - S.housing_top_z, M.cradle, bx, (S.rim_z + S.housing_top_z) / 2, bz));         // cup skirt
    const bowl = new THREE.Mesh(new THREE.SphereGeometry(ball.d / 2 + 1.2, 48, 24, 0, Math.PI * 2, Math.PI / 2 + 0.25, Math.PI / 2 - 0.25), M.cradle);
    bowl.position.set(bx, S.ball_centre_z, bz); g.add(bowl);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(ball.d / 2 + 1.3, 1.0, 12, 64), M.cradle);   // retainer ring
    ring.rotation.x = Math.PI / 2; ring.position.set(bx, S.rim_z + 1.2, bz); g.add(ring);
    for (const a of [30, 150, 270]) {                                                                    // retainer claws
      const t = THREE.MathUtils.degToRad(a), r = ball.d / 2 + 1.6;
      g.add(box(2.0, S.claw_top_z - S.rim_z, 6.0, M.cradle, bx + r * Math.cos(t), (S.claw_top_z + S.rim_z) / 2, bz + r * Math.sin(t), -a));
    }
    for (const a of [60, 180, 300]) {                                                                    // 2 mm ZrO2 bearings, 35 deg below the equator
      const t = THREE.MathUtils.degToRad(a), r = (ball.d / 2 + 1) * Math.cos(THREE.MathUtils.degToRad(35));
      { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), M.bearing); m.position.set(bx + r * Math.cos(t), S.bearing_contact_z - 0.5, bz + r * Math.sin(t)); g.add(m); }
    }
  }
  // --- bottom-side parts ---
  {
    const g = layer('Bottom-side parts', -5, '#3B3B3F', { x: 20, y: -3, z: 28 });
    for (const k of H.keys) {
      const p = keyLocal(k, 2.5, -5.4);
      g.add(box(14.8, 1.8, 6.6, M.socket, p.x, -PCB_T - 0.9, p.z, k.rot));
      const d = keyLocal(k, 0, 6);
      g.add(box(2.8, 1.1, 1.7, M.diode, d.x, -PCB_T - 0.55, d.z, k.rot));
    }
    if (H.fpc) g.add(box(8.6, 2.0, 4.8, M.metal, H.fpc.x, -PCB_T - 1.0, H.fpc.y + 0.6));
    g.add(box(3.0, 1.5, 7.0, M.black, D.power_switch.x, -PCB_T - 0.75, D.power_switch.y));
    g.add(box(2.0, 1.5, 1.5, M.metal, D.power_switch.x - 2.5, -PCB_T - 0.75, D.power_switch.y));  // actuator at the inner edge
    g.add(box(3.5, 1.7, 2.9, M.metal, D.reset.x, -PCB_T - 0.85, D.reset.y));
    g.add(box(8.0, 6.0, 6.0, M.black, D.jst.x, -PCB_T - 3.0, D.jst.y + 0.5));   // optional JST, 6 mm tall
  }
  // --- PCB ---
  {
    const g = layer(`${half === 'left' ? 'Left' : 'Right'} PCB (1.6 mm)`, 0, '#2E5A3B', { x: B.max_x - 6, y: 0, z: B.min_y + 30 });
    g.add(slab(ol, PCB_T, 0, M.pcb));
    for (const h of H.holes) g.add(cyl(1.6, PCB_T + 0.2, M.metal, h.x, -PCB_T / 2, h.y));
    const tp = H.test_pads;
    for (let i = 0; i < tp.labels.length; i++) g.add(cyl(0.75, 0.1, M.pcbEdge, tp.start.x + i * tp.pitch, 0.05, tp.start.y));
    g.add(box(1.7, 0.1, 4.6, M.pcbEdge, D.battery_pads.x, 0.05, D.battery_pads.y));
  }
  // --- battery under the controller (301230, left half) ---
  if (!ball) {
    const g = layer('Battery 301230 (under controller)', 6, '#8E9CB0', { x: c.x - 14, y: 2, z: c.y + 20 });
    g.add(box(11.5, 3.3, 32, M.battery, c.x, 1.65, c.y + 1.5));
  }
  // --- controller ---
  {
    const g = layer('Controller nice!nano v2', 14, '#1C2538', { x: c.x - 16, y: 6, z: c.y - 12 });
    for (const sx of [-7.62, 7.62]) g.add(box(2.6, 3.5, 30.5, M.black, c.x + sx, 1.75, c.y));   // 1.27 mm socket strips
    g.add(box(c.w, 1.0, c.l, M.ctrl, c.x, 4.0, c.y - 0.6));
    g.add(box(6, 1.2, 6, M.black, c.x, 5.1, c.y + 2));                     // nRF52840 module
    g.add(box(9, 3.2, 7.3, M.metal, c.x, 5.6, c.y - c.l / 2 + 2.5));        // USB-C shell at the top edge
    g.add(box(1.2, 0.6, 1.6, M.stem, c.x + 5, 4.8, c.y - 8));               // blue status LED spot
  }
  // --- switches ---
  {
    const g = layer('Choc V1 switches', 24, '#EDE8DF', { x: 36, y: 4, z: -4 });
    for (const k of H.keys) {
      g.add(box(D.switch_body, 2.2, D.switch_body, M.switchBody, k.x, 1.1, k.y, k.rot));
      g.add(box(11.5, 2.8, 11.5, M.switchBody, k.x, 3.6, k.y, k.rot));
      g.add(box(4.5, 1.5, 3.0, M.stem, k.x, 5.75, k.y, k.rot));
    }
  }
  // --- keycaps ---
  {
    const g = layer('Keycaps (MBK 1u)', 34, '#F4F0E7', { x: 36, y: 10, z: 44 });
    for (const k of H.keys) {
      const outerCol = k.ref.endsWith('0');
      const mat = k.kind === 'thumb' ? M.capThumb : (outerCol ? M.capGrey : M.cap);
      g.add(box(D.keycap.width, 3.0, D.keycap.height, mat, k.x, 7.0, k.y, k.rot));
      g.add(box(D.keycap.width - 3, 0.6, D.keycap.height - 3, mat, k.x, 8.6, k.y, k.rot));
    }
  }
  // --- ball ---
  if (ball) {
    const g = layer(`Trackball ${ball.d} mm`, 28, '#FFFFFF', { x: bx + 20, y: S.ball_centre_z + 6, z: bz - 6 });
    { const m = new THREE.Mesh(new THREE.SphereGeometry(ball.d / 2, 64, 48), M.ball); m.position.set(bx, S.ball_centre_z, bz); g.add(m); }
  }
  // --- plate / top frame placeholder ---
  {
    const g = layer('Top frame (concept)', 44, '#D8CDBB', { x: B.min_x + 20, y: 9, z: B.min_y + 4 });
    g.add(slab(outlineShape(H.outline, [{ points: H.outline_frame_hole }]), 3.0, 8.0, M.plate));
  }
  // --- pocket rim marker ---
  if (ball) {
    const g = layer('Pocket rim (future case)', 54, '#E8762E', { x: bx, y: S.claw_top_z + 4, z: bz + 10 });
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(ball.pocket_d / 2 + 2, ball.pocket_d / 2 + 2, S.claw_top_z + 1.6, 32, 1, true), M.rim);
    rim.position.set(bx, (S.claw_top_z - 1.6) / 2, bz); g.add(rim);
  }

  buildLabels();
  buildDims();
  titleEl.textContent = `${D.name} ${D.revision}, ${half} half (${H.keys.length} keys${ball ? ', ' + ball.d + ' mm ball' : ''})`;
  sectionIn.disabled = !ball;
  if (!ball && sectionIn.checked) { sectionIn.checked = false; setSection(false); }
  setExplode(explode);
}

// ---------- section view: clip everything in front of the ball centre ----------
function setSection(on) {
  for (const m of Object.values(M)) { m.clippingPlanes = on ? [clipPlane] : []; m.needsUpdate = true; }
  sectionLabel.hidden = !on;
}

// ---------- labels, layer list, dimensions ----------
const labelsEl = document.getElementById('labels');
const leaders = document.getElementById('leaders');
const layerList = document.getElementById('layerList');
const dimsEl = document.getElementById('dims');
const noteEl = document.getElementById('note');
const titleEl = document.getElementById('title');
let labelNodes = [];
const sectionLabel = document.createElement('div');
sectionLabel.className = 'label on';
sectionLabel.hidden = true;

function buildLabels() {
  labelsEl.replaceChildren();
  leaders.replaceChildren();
  layerList.replaceChildren();
  labelNodes = layers.map((l, i) => {
    const el = document.createElement('div');
    el.className = 'label';
    el.textContent = l.name;
    labelsEl.appendChild(el);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    leaders.appendChild(line);
    const lab = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('change', () => { l.group.visible = cb.checked; });
    const sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = l.color;
    lab.append(cb, sw, document.createTextNode(l.name));
    layerList.appendChild(lab);
    return { el, line };
  });
  labelsEl.appendChild(sectionLabel);
  if (H.stack) sectionLabel.innerHTML = `lens gap <small>${H.stack.lens_reference_plane_dist.toFixed(1)} mm (2.2 to 2.6)</small>`;
}

function buildDims() {
  const S = H.stack, B = H.bounds;
  const dims = [
    ['Board outline', `${B.width.toFixed(1)} x ${B.height.toFixed(1)} mm`],
    ['Keys', `${H.keys.length} (${H.keys.filter((k) => k.kind === 'thumb').length} thumb)`],
    ['PCB thickness', `${PCB_T.toFixed(1)} mm`],
    ['Controller top', `+${(3.5 + 1.0 + 1.2).toFixed(1)} mm`],
    ['Keycap top', '+8.9 mm'],
    ['Mounting holes', `${H.holes.length} x M2`],
    ['Test pads', H.test_pads.labels.join(' ')],
  ];
  if (S) dims.push(
    ['Ball top above PCB', `+${S.ball_top_above_pcb_top.toFixed(1)} mm`],
    ['Ball centre above PCB', `+${S.ball_centre_z.toFixed(1)} mm`],
    ['Cup rim', `+${S.rim_z.toFixed(1)} mm`],
    ['Case floor under the module', `${S.floor_z.toFixed(1)} mm`],
    ['Cup outer diameter', `${S.cup_outer_d.toFixed(1)} mm`],
    ['Cradle envelope above PCB', `${S.envelope_d_above_pcb.toFixed(1)} mm`],
    ['PCB notch', `octagon, apothem ${S.notch_apothem.toFixed(0)} mm`],
    ['Case pocket', `${H.ball.pocket_d.toFixed(0)} mm`],
    ['Housing on the floor', `${S.footprint_x.toFixed(0)} x ${S.footprint_y.toFixed(0)} mm (with ears)`],
  );
  dimsEl.replaceChildren();
  for (const [k, v] of dims) { const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dimsEl.append(dt, dd); }
  noteEl.innerHTML = H.ball
    ? '<b>Reading the stack.</b> PCB top is the zero plane. Hot-swap sockets, diodes and connectors hang below the PCB; the controller sits on 3.5 mm sockets. The trackball module stands on the case floor in a pocket beside the PCB: its housing holds the sensor board, the cup rises through the octagonal notch and nothing touches the PCB. The pocket rim is only a marker for the future case.'
    : '<b>Reading the stack.</b> PCB top is the zero plane. Hot-swap sockets, diodes and connectors hang below the PCB; the controller sits on 3.5 mm sockets with the 301230 cell underneath. The left half has three thumb keys and no ball, no FPC connector and nine test pads.';
}

// ---------- minimal orbit control ----------
const sph = { r: 230, theta: 0.55, phi: 1.05 };
const home = { ...sph };
function applyCamera() {
  camera.position.set(
    target.x * root.scale.x + sph.r * Math.sin(sph.phi) * Math.sin(sph.theta),
    target.y + sph.r * Math.cos(sph.phi),
    target.z + sph.r * Math.sin(sph.phi) * Math.cos(sph.theta));
  camera.lookAt(target.x * root.scale.x, target.y, target.z);
}
let drag = null, pinch = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); autoRotate.checked = false; });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  sph.theta -= (e.clientX - drag.x) * 0.006;
  sph.phi = THREE.MathUtils.clamp(sph.phi - (e.clientY - drag.y) * 0.006, 0.15, 1.5);
  drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); sph.r = THREE.MathUtils.clamp(sph.r * (1 + e.deltaY * 0.001), 90, 600); }, { passive: false });
canvas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2 && pinch) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    sph.r = THREE.MathUtils.clamp(sph.r * pinch / d, 90, 600); pinch = d;
  }
}, { passive: true });

// ---------- controls ----------
const explodeIn = document.getElementById('explode');
const explodeVal = document.getElementById('explodeVal');
const viewTag = document.getElementById('viewTag');
const autoRotate = document.getElementById('rotate');
const sectionIn = document.getElementById('section');
const showLabels = document.getElementById('showLabels');
const playBtn = document.getElementById('play');
let explode = 0, anim = null;
function setExplode(v) {
  explode = v; explodeIn.value = v.toFixed(2); explodeVal.textContent = v.toFixed(2);
  viewTag.textContent = v < 0.02 ? 'assembled' : v > 0.98 ? 'exploded' : 'exploding';
  for (const l of layers) l.group.position.y = l.explode * v;
}
explodeIn.addEventListener('input', () => { anim = null; setExplode(parseFloat(explodeIn.value)); });
playBtn.addEventListener('click', () => {
  const to = explode > 0.5 ? 0 : 1;
  if (reduced) { setExplode(to); return; }
  anim = { from: explode, to, t0: performance.now(), dur: 1600 };
});
document.getElementById('reset').addEventListener('click', () => { Object.assign(sph, home); autoRotate.checked = true; });
for (const r of document.querySelectorAll('input[name=half]')) r.addEventListener('change', () => { if (r.checked) build(r.value); });
sectionIn.addEventListener('change', () => setSection(sectionIn.checked));
showLabels.addEventListener('change', () => { labelsEl.style.visibility = leaders.style.visibility = showLabels.checked ? 'visible' : 'hidden'; });

// ---------- theme-aware background ----------
function applyTheme() { renderer.setClearColor(new THREE.Color(css('--bg') || '#ECE8DF')); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
applyTheme();

// ---------- resize + render loop ----------
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  leaders.setAttribute('viewBox', `0 0 ${w} ${h}`);
}
new ResizeObserver(resize).observe(stage);
resize();
build('right');
const v = new THREE.Vector3();
function project(x, y, z) {
  v.set(x * root.scale.x, y, z).project(camera);
  return { x: (v.x + 1) / 2 * stage.clientWidth, y: (1 - v.y) / 2 * stage.clientHeight, behind: v.z > 1 };
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (autoRotate.checked && !drag && !reduced) sph.theta += dt * 0.18;
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    setExplode(anim.from + (anim.to - anim.from) * e);
    if (k >= 1) anim = null;
  }
  applyCamera();
  renderer.render(scene, camera);
  const show = explode > 0.35;
  layers.forEach((l, i) => {
    const { el, line } = labelNodes[i];
    const on = show && l.group.visible;
    el.classList.toggle('on', on);
    if (!on) { line.setAttribute('opacity', 0); return; }
    const a = l.anchor, y = a.y + l.explode * explode;
    const p = project(a.x, y, a.z);
    const side = (a.x * root.scale.x) < (target.x * root.scale.x) ? -1 : 1;
    const lx = p.x + side * 110, ly = p.y - 18;
    el.style.left = lx + 'px'; el.style.top = ly + 'px';
    line.setAttribute('x1', p.x); line.setAttribute('y1', p.y); line.setAttribute('x2', lx - side * 48); line.setAttribute('y2', ly);
    line.setAttribute('opacity', p.behind ? 0 : 1);
  });
  if (!sectionLabel.hidden && H.ball) {
    const p = project(H.ball.x, H.stack.ball_centre_z - H.ball.d / 2 - 1.2, H.ball.y + 0.1);
    sectionLabel.style.left = (p.x + 90) + 'px'; sectionLabel.style.top = p.y + 'px';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
