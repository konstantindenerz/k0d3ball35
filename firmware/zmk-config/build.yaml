# Build matrix consumed by .github/workflows/firmware.yml
# board names follow the Zephyr 4.1 hardware model: nice_nano//zmk == nice_nano v2
---
include:
  - board: nice_nano//zmk
    shield: k0d3ball35_right
    snippet: studio-rpc-usb-uart
    artifact-name: k0d3ball35_right-nice_nano_v2
  - board: nice_nano//zmk
    shield: k0d3ball35_left
    artifact-name: k0d3ball35_left-nice_nano_v2
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset-nice_nano_v2
