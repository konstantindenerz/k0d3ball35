# Shared configuration for both halves of k0d3ball35.

# Pointing device support (trackball on the central, mouse keys everywhere).
# Central-only pointing and battery symbols live in k0d3ball35_right.conf; on
# the peripheral they would only produce "unsatisfied dependencies" warnings.
CONFIG_ZMK_POINTING=y

# ZMK Studio (keymap editing at runtime; the right half is built with the
# studio-rpc-usb-uart snippet, see build.yaml)
CONFIG_ZMK_STUDIO=y

# Battery reporting (both halves; the central additionally proxies the
# peripheral's level, see k0d3ball35_right.conf)
CONFIG_ZMK_BATTERY_REPORTING=y

# Power: deep sleep after 30 min idle, controller VCC rail (and therefore the
# sensor) is switched off while sleeping.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_EXT_POWER=y

# Bluetooth: +8 dBm helps with metal desks and the body between the halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Home-row mods feel better with a slightly larger debounce on hot-swap sockets
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8
