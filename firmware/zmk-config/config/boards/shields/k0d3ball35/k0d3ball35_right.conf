# Right half: split central with the PAW3222 sensor (driver: zmk-driver-paw3222, west.yml).
CONFIG_PAW3222=y
# Sensor motion does not wake the MCU from deep sleep; keys do.

# Central-only options (depend on ZMK_SPLIT_ROLE_CENTRAL)
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
# Report the peripheral's battery level to the host as well
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
