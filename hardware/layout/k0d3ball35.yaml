# k0d3ball35 layout - single source of truth for the key geometry (revision r2).
# SPDX-License-Identifier: CERN-OHL-P-2.0
#
# Coordinates describe a half in millimetres in its own frame: x grows outward
# (towards the pinky), y grows downward (towards the user). The origin is the centre
# of the middle-column top key. Both halves share this frame; the left half is
# rendered mirrored for display only. Since r2 the two halves are separate PCBs:
#   left  = 15 finger keys + 3 thumb keys, no trackball
#   right = 15 finger keys + 2 thumb keys (the two INNER ones) + trackball pocket
# Since r2.3 the ball sits where the outer thumb key used to be, not outboard of it: every
# reference design (Keyball 39/44/61, torabo-tsuki LP, Charybdis) drops the outermost thumb
# key on the ball half, and a 19 mm ball has to sit further in than a 34 mm one because the
# thumb touches its near surface, not its centre (issues/hw-ball-inboard-r2-3.md).
#
# The column stagger and the thumb arc are the Keyball39 proportions (measured from
# the published Keyball39 gerbers: 19.05 mm pitch, stagger 11.70 / 4.70 / 0 / 2.50 /
# 5.00 mm, thumb keys at 0 / 10 / 20 degrees) scaled to the Choc 18 x 17 mm pitch.

name: k0d3ball35
revision: r2
units: mm

pitch:
  x: 18.0
  y: 17.0

keycap:            # Choc 1u cap footprint used for clearance checks and outlines
  width: 17.5
  height: 16.5

switch_body: 13.8  # Choc V1 housing, square

# Finger columns, outer to inner. "stagger" is the y offset of row 0 relative to the
# middle column (positive = lower). Values are Keyball39 stagger * 17 / 19.05.
columns:
  - { name: pinky,  col: 0, x: 36.0,  stagger: 10.44 }
  - { name: ring,   col: 1, x: 18.0,  stagger: 4.19 }
  - { name: middle, col: 2, x: 0.0,   stagger: 0.0 }
  - { name: index,  col: 3, x: -18.0, stagger: 2.23 }
  - { name: inner,  col: 4, x: -36.0, stagger: 4.46 }

rows: 3            # finger rows 0..2; row 3 is the thumb row

# Thumb key positions. Offsets are relative to the centre of the inner column's bottom
# key (row 2). Keyball39 offsets (+15.05/+23.75, -6.50/+25.55, -27.42/+31.07 mm) scaled
# by 18/19.05 in x and 17/19.05 in y. Rotation is KiCad convention (positive = CCW).
# Which of these a half uses is listed under halves.<side>.thumbs.
thumbs:
  - { name: thumb_outer,  row: 3, col: 2, dx: 14.22,  dy: 21.19, rotation: 0 }
  - { name: thumb_middle, row: 3, col: 3, dx: -6.14,  dy: 22.80, rotation: 10 }
  - { name: thumb_inner,  row: 3, col: 4, dx: -25.91, dy: 27.73, rotation: 20 }

# Trackball parameters shared by every half that has a ball (centre under halves.<side>).
# The ball sits in a case pocket BESIDE the PCB: the sensor board lies on the case floor,
# the cradle is screwed to the case, the PCB edge gets an octagonal notch around it.
trackball:
  ball_diameter: 19.05          # 3/4 inch POM ball (25 mm cradle still available as a parameter)
  cradle_diameter: 28.0         # outer diameter of the cradle flange (clearance check)
  min_keycap_clearance: 1.0     # cradle flange to any keycap
  pocket:
    notch_clearance: 1.0        # PCB notch = cradle radius + this (octagon apothem)
    wall: 2.0                   # case wall around the cradle (pocket circle above the PCB plane)
    housing: { x: 29.0, y: 29.0 }   # cradle housing on the case floor (sensor board 26 x 25 plus walls), no ears.
                                    # x is 1 mm narrower than the notch across flats so the housing clears the
                                    # board edge at x = -10 on its way into the pocket (walls 1.5 mm on x, 2 on y).
    cup_envelope: 24.1          # widest part of the cradle above the PCB plane (bearing bosses), cradle stack.json
    cable_gap_min: 1.5          # radial room the FFC needs between the cup envelope and the notch edge
    housing_clearance: 0.5      # gap between housing and pocket wall at floor level
    case_screw_spacing: 20.0    # two M2 x 10 from below through floor and sensor board into the posts, on the y axis
    sensor_board: { x: 26.0, y: 25.0 }   # daughterboard inside the housing, long side along x
    # r2.2: the module is a cartridge. It is lowered into the pocket and lifted out again with
    # the PCB fitted, so nothing of it may be covered by the board. The notch's 45 degree facet
    # towards the keys used to overhang the housing corner by 5.86 mm and the sensor board by
    # 3.03 mm, so that one corner of the notch is square (issues/mech-cradle-notch-relief.md).
    square_corner: true
    corner_clearance: 0.3       # minimum gap between the module and the PCB edge on its way in
    cable_width: 6.0            # FFC corridor on the board: 4.4 mm cable plus handling clearance

controller:                     # nice!nano v2 / SuperMini, Pro Micro pinout, on the lowest sockets (2.5 mm class,
  center: { x: -58.0, y: 11.7 } # Mill-Max 315 or conthrough): nothing lies between the controller and the PCB any more.
  rotation: 0                   # USB connector towards the top (away from the user). The centre is the hole pattern's
  size: { x: 18.0, y: 33.5 }    # centre; the board itself sits 0.6 mm further up (pcb_offset_y).
  pcb_offset_y: -0.6            # controller board centre relative to the hole pattern centre
  usb_shell: 0.6                # USB-C shell past the controller's own board edge (34.1 mm overall vs 33.5 mm board)
  usb_overhang: 1.5             # USB-C shell past the main PCB edge: the controller block's top edge is derived from this
  pin_pitch: 2.54
  row_spacing: 15.24            # 2 x 7.62
  socket_height: 2.5            # design value for the stack (controller PCB underside above the main PCB top)

# Battery: one PKCELL LP552035 cell (350 mAh, JST-PH plug, protection circuit) per half, identical
# on both halves. The cell lies UNDER the PCB below the controller, in a well of the case floor (the
# "battery bay"). The back of the PCB carries nothing there except the right row of socket tails, so
# the bay is the same rectangle on both boards: it starts between the two controller hole rows and
# runs down to the reset button. The lead / PCM end points towards +y, where J3 (JST-PH, default)
# and the J2 pads sit. Any cell up to 20.5 x 37.5 x 7.2 mm fits (702025, 602025, 502030, 602030, 552035).
battery:
  cell: "LP552035"
  capacity_mah: 350
  size: { x: 20.5, y: 37.5, z: 5.7 }            # PKCELL datasheet maxima incl. protection circuit
  bay: { center: { x: -53.9, y: 17.5 }, size: { x: 21.0, y: 41.0 } }   # on the back, x -64.4..-43.4, y -3..38
  depth_below_pcb: 9.0          # well floor below the PCB underside: tails 1.0 + pad 0.5 + up to 7.2 mm cell + 0.3 clearance
  edge_clearance: 1.5           # minimum distance from the bay to the PCB edge
  leads: "+y"                   # lead end towards J3 / J2

power_switch: { center: { x: -68.5, y: 30.0 }, rotation: 270 }  # MSK12C02, bottom side; 270 puts the actuator (local +y) at -x, through the inner edge
reset_button: { center: { x: -66.0, y: 41.0 }, rotation: 0 }    # EVQP7A, bottom side, inner corner below the power switch and the battery bay
battery_pads: { center: { x: -57.0, y: 50.5 }, rotation: 0 }    # 2 x 1.7 mm PTH, 2.54 mm pitch, B+ / B-, below the JST (solder alternative)
battery_jst:  { center: { x: -56.0, y: 44.0 }, rotation: 0 }    # S2B-PH-SM4-TB, 6 mm tall, bottom side, default, below the battery bay (sits in the same well)

test_pads:                      # spare controller pins as 1.5 mm pads, in a row below the battery pads
  start: { x: -66.0, y: 57.5 }
  pitch: 2.5
  direction: x

mounting_holes:                 # M2 through holes for the case (2.2 mm), in the gaps between switches, both halves
  - { x: 27.0,  y: 10.8 }       # ring / pinky, top (outside the socket pad bands)
  - { x: 27.0,  y: 44.5 }       # ring / pinky, bottom
  - { x: -9.0,  y: 40.0 }       # middle / index, bottom
  - { x: -27.0, y: 8.0 }        # index / inner, top
# The fifth hole sits in the thumb cluster, whose shape differs per half since r2.3, so it is
# listed under halves.<side>.mounting_holes instead of here.

stitching_vias:                 # GND vias tying the two pours together (free spots between switches), both halves
  - [27.0, 27.5]
  - [9.0, 6.0]
  - [-27.0, 25.0]
  - [-45.0, 31.5]
  - [-28.0, 48.5]
  - [28.5, 50.0]
  - [-64.5, 46.8]
  - [-70.0, 15.0]
  - [-33.0, 47.5]

outline:
  margin: 0.5                   # PCB edge outside the keycap rectangles
  socket_margin: 1.1            # extra width per side so the hot-swap socket pads (9.8 mm out) keep 0.3 mm to the edge
  corner_radius: 0.0            # r2: angular, 90 degree steps, no rounding (the fab's 1 mm router radius is accepted)
  controller_margin: 2.0

silkscreen:
  title: k0d3ball35
  revision_text: r2
  # Owner wordmark (docs/images/logo.svg, see NOTICE) on the back silkscreen, under the thumb
  # bridge. That band is the only place on either face that is clear of pads and of the other
  # silkscreen on both halves; the front is boxed in between the title text and the reset and
  # JST courtyards. cell is the stroke width, the mark is 18 x 35 cells, so 0.26 gives
  # 13.9 x 4.7 mm with 0.26 mm strokes - well above the 0.15 mm a fab can hold.
  logo:
    layer: B.SilkS
    cell: 0.26
    rotation: 90
    center: {x: -35.0, y: 48.4}

# Per-half data. Lists here are ADDED to the global ones (mounting_holes, stitching_vias);
# scalar blocks (trackball.center, fpc) exist only where given.
halves:
  left:
    thumbs: [thumb_outer, thumb_middle, thumb_inner]
    mounting_holes:
      - { x: -32.0, y: 61.0 }     # between the outer and the middle thumb key
    stitching_vias:
      - [-15.0, 65.0]
    # Hand-placed tracks for the rotated thumb cluster (the autorouter does not reach pads of
    # footprints rotated by 10/20 degrees). Points are layout coordinates or pad references:
    # "REF:joiner" = the switch's plated pin-1 joiner pad, "REF:pad2" / "REF:pad2f" = the switch's
    # socket pad 2 on the back / front face, "REF:bus" = bottom end of the column bus at this key,
    # "REF:1" / "REF:2" = diode pad 1 (cathode) / pad 2 (anode).
    # The left BOARD is the mirror image of the frame (x -> -x) while the footprints are not
    # mirrored, so pad references land on the mirrored side of their part and the free points
    # below are chosen for the left board, not copied from the right half.
    manual_routes:
      # ROW3 along the thumb diodes on the back: the cathodes sit on the pinky side of each diode
      # on the left board, so the track passes above the diode bodies (between the switch holes
      # and the diodes) before dropping onto the next cathode.
      - { net: ROW3, layer: B.Cu, width: 0.25,
          points: ["D32:1", [-19.0, 63.3], [-34.5, 63.3], [-38.3, 65.6], "D33:1"] }
      - { net: ROW3, layer: B.Cu, width: 0.25,
          points: ["D33:1", [-38.6, 64.8], [-50.0, 64.8], "D34:1"] }
      - { net: COL3, layer: B.Cu, width: 0.25,
          points: ["SW23:bus", [-15.4, 49.5], "SW33:joiner"] }
      # Controller to the inner column and the thumb row: the router gives up on these two on the
      # left, so they are fixed. COL4 leaves hole 11 under the controller's bottom holes on the
      # back; ROW3 leaves hole 20 (inner-edge hole column on the left board) on the front, crosses
      # between the hole rows, runs down past the test pad row and ends at the middle thumb cathode.
      - { net: COL4, layer: B.Cu, width: 0.25,
          points: ["U1:11", [-52.5, 23.1], [-52.5, 29.8], [-35.8, 29.8], "SW24:bus"] }   # sideways first, clear of hole 12 below
      - { net: ROW3, layer: F.Cu, width: 0.25,
          points: ["U1:20", [-64.3, 16.78], [-48.3, 16.78], [-48.3, 28.0], [-50.75, 30.5], [-50.75, 64.0], "D33:1"] }
      - { net: COL4, layer: B.Cu, width: 0.25,   # below the battery pads, between TP4 and TP5, to the inner thumb key
          points: ["SW24:bus", [-33.4, 45.8], [-52.5, 52.8], [-60.75, 52.8], [-60.75, 56.5], "SW34:joiner"] }
      # Inner thumb key (20 deg): anode to socket pad 2 on the back along the board edge; the front
      # copy of pad 2 is fed around the switch centre hole and the post.
      - { net: SW34, layer: B.Cu, width: 0.25,
          points: ["D34:2", [-66.3, 71.0], "SW34:pad2"] }
      - { net: SW34, layer: F.Cu, width: 0.25,
          points: ["D34:2", [-62.6, 69.4], [-56.0, 69.4], [-54.0, 67.0], [-53.3, 61.5], "SW34:pad2f"] }
      - { net: COL2, layer: B.Cu, width: 0.25,   # down the bus line, along the lower edge of SW22 past H3, into the thumb bridge
          points: ["SW22:bus", [2.6, 42.0], [-8.6, 42.0], [-12.1, 43.3], [-12.1, 50.0], "SW32:joiner"] }
    test_pads:                      # nine pads on the left: one row below the battery pads, above the inner thumb key
      start: { x: -69.5, y: 54.5 }
  right:
    thumbs: [thumb_middle, thumb_inner]   # the outer position is the ball's since r2.3
    trackball:
      center: { x: -13.0, y: 66.0 }  # 5 mm outboard of the index column, 29.5 mm from the middle
                                     # thumb key: the band the reference designs land in once their
                                     # 34 mm ball is radius-corrected to 19.05 mm
    fpc:                            # sensor daughterboard connector, KEY SIDE (r2.2): the cable climbs
                                    # the gap between the cradle cup and the notch, folds over the board
                                    # edge at y = 49 and enters the connector from +y, so the lock stays
                                    # reachable with everything assembled (docs/08-trackball-module.md).
      center: { x: -20.6, y: 46.5 }   # ball x - 7.6, which is the cradle's cable_ch_x: the FFC runs
                                      # straight from the channel into the connector. y puts the mouth
                                      # 0.5 mm short of the notch edge and clears D23's courtyard
      rotation: 0
      side: top
    mounting_holes:
      - { x: -52.0, y: 52.0 }     # above the inner thumb key; the left half's spot is in the pocket now
    stitching_vias:
      - [4.0, 58.0]               # the old spot (-14, 58) is inside the notch since r2.3
    # The thumb pair is the middle (10 deg) and inner (20 deg) key since r2.3, so the right board
    # needs the same hand routes the left one needs, laid out for the unmirrored board.
    manual_routes:
      - { net: ROW3, layer: B.Cu, width: 0.25,   # thumb diode chain, 10 deg to 20 deg
          points: ["D33:1", [-47.0, 65.0], [-56.0, 67.0], "D34:1"] }
      - { net: COL3, layer: B.Cu, width: 0.25,
          points: ["SW23:bus", [-20.6, 49.5], "SW33:joiner"] }
      - { net: COL4, layer: B.Cu, width: 0.25,   # inner column bus down to the 20 deg key
          points: ["SW24:bus", [-38.6, 50.0], [-55.0, 54.0], [-59.0, 58.0], "SW34:joiner"] }
      - { net: SW34, layer: B.Cu, width: 0.25,   # 20 deg key: anode to socket pad 2 on the back
          points: ["D34:2", [-62.0, 71.5], "SW34:pad2"] }
      - { net: SW34, layer: F.Cu, width: 0.25,   # and the front copy of pad 2 around the centre hole
          points: ["D34:2", [-59.0, 70.0], [-53.5, 69.0], [-51.5, 66.5], [-51.0, 62.0], "SW34:pad2f"] }
