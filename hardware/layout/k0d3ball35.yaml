# k0d3ball35 layout - single source of truth for the key geometry (revision r2.4).
# SPDX-License-Identifier: CERN-OHL-P-2.0
#
# Coordinates describe a half in millimetres in its own frame: x grows outward
# (towards the pinky), y grows downward (towards the user). The origin is the centre
# of the middle-column top key. Both halves share this frame; the left half is
# rendered mirrored for display only. Since r2 the two halves are separate PCBs:
#   left  = 15 finger keys + 3 thumb keys, no trackball
#   right = 15 finger keys + 2 thumb keys (the two INNER ones) + trackball pocket
# Since r2.3 the ball sits where the outer thumb key used to be, not outboard of it: every
# reference design (Keyball 39/44/61, torabo-tsuki LP, Charybdis) drops the outermost thumb
# key on the ball half, and a 19 mm ball has to sit further in than a 34 mm one because the
# thumb touches its near surface, not its centre (issues/hw-ball-inboard-r2-3.md).
#
# The column stagger and the thumb arc are the Keyball39 proportions (measured from
# the published Keyball39 gerbers: 19.05 mm pitch, stagger 11.70 / 4.70 / 0 / 2.50 /
# 5.00 mm, thumb keys at 0 / 10 / 20 degrees) scaled to the Choc 18 x 17 mm pitch.

name: k0d3ball35
revision: r2.4
units: mm

pitch:
  x: 18.0
  y: 17.0

keycap:            # Choc 1u cap footprint used for clearance checks and outlines
  width: 17.5
  height: 16.5

switch_body: 13.8  # Choc V1 housing, square

# Finger columns, outer to inner. "stagger" is the y offset of row 0 relative to the
# middle column (positive = lower). Values are Keyball39 stagger * 17 / 19.05.
columns:
  - { name: pinky,  col: 0, x: 36.0,  stagger: 10.44 }
  - { name: ring,   col: 1, x: 18.0,  stagger: 4.19 }
  - { name: middle, col: 2, x: 0.0,   stagger: 0.0 }
  - { name: index,  col: 3, x: -18.0, stagger: 2.23 }
  - { name: inner,  col: 4, x: -36.0, stagger: 4.46 }

rows: 3            # finger rows 0..2; row 3 is the thumb row

# Thumb key positions. Offsets are relative to the centre of the inner column's bottom
# key (row 2). Keyball39 offsets (+15.05/+23.75, -6.50/+25.55, -27.42/+31.07 mm) scaled
# by 18/19.05 in x and 17/19.05 in y. Rotation is KiCad convention (positive = CCW).
# Which of these a half uses is listed under halves.<side>.thumbs.
thumbs:
  - { name: thumb_outer,  row: 3, col: 2, dx: 14.22,  dy: 21.19, rotation: 0 }
  - { name: thumb_middle, row: 3, col: 3, dx: -6.14,  dy: 22.80, rotation: 10 }
  - { name: thumb_inner,  row: 3, col: 4, dx: -25.91, dy: 27.73, rotation: 20 }

# Trackball parameters shared by every half that has a ball (centre under halves.<side>).
# The ball sits in a case pocket BESIDE the PCB: the cradle (with the tilted sensor module in
# its sleeve) stands on the case floor and is screwed to it, the PCB edge gets an octagonal notch around it.
trackball:
  ball_diameter: 19.05          # 3/4 inch POM ball. The only supported size since r2.4.
  cradle_diameter: 28.0         # outer diameter of the cradle flange (clearance check)
  min_keycap_clearance: 1.0     # cradle flange to any keycap
  pocket:
    notch_clearance: 1.5        # PCB notch = cradle radius + this (octagon apothem). Was 1.0 until
                                # r2.4: the tilted module reaches 14.96 mm inside the PCB slab, so
                                # an apothem of 15.0 left 0.04 mm - no margin for a printed sleeve
                                # and a module whose 8.0 mm width is a nominal figure. 15.5 gives
                                # 0.54 mm. Changed while the PCBs were still unordered.
    wall: 2.0                   # case wall around the cradle (pocket circle above the PCB plane)
    housing: { x: 29.0, y: 24.0 }   # cup (23.05) plus the tilted module sleeve. Not centred on the
    housing_offset: { x: 2.55, y: 0.0 }   # ball any more: the sleeve leans towards +x (under the middle
                                    # column, where the PCB already ends at y 42.8), so the box spans
                                    # x -24.95 .. 4.05; y only needs the cup. Was +y until r2.4b, which
                                    # made the case 5 mm deeper (issues/mech-sensor-side-x.md).
    cup_envelope: 23.05         # widest part of the cradle cup above the PCB plane, cradle stack.json
    cable_gap_min: 1.5          # radial room the FFC needs between the cup envelope and the notch edge
    housing_clearance: 0.5      # gap between housing and pocket wall at floor level
    case_screw_spacing: 20.0    # two M2 x 8 from below through the floor into the cup skirt, on the y axis through the ball (clear of the bearings and the sleeve)
    sensor_board: { x: 5.0, y: 13.4 }    # PROJECTION of the tilted 13.4 x 7.4 mm PAW3222 module (maker
    sensor_board_offset: { x: 13.9, y: 0.0 }   # drawing): 13.4 mm across the tilt, 5.0 mm along it,
                                    # centred 13.9 mm towards +x of the ball axis. Spans 11.4..16.4,
                                    # the module from its near face to its far corner (cradle
                                    # stack.json board_reach / module_reach).
    # r2.2: the module is a cartridge. It is lowered into the pocket and lifted out again with
    # the PCB fitted, so nothing of it may be covered by the board. The notch's 45 degree facet
    # towards the keys used to overhang the housing corner by 5.86 mm and the sensor board by
    # 3.03 mm, so that one corner of the notch is square (issues/mech-cradle-notch-relief.md).
    square_corner: true
    corner_clearance: 0.3       # minimum gap between the module and the PCB edge on its way in
    cable_width: 6.0            # FFC corridor on the board: 4.4 mm cable plus handling clearance

controller:                     # nice!nano v2 / SuperMini, Pro Micro pinout, on the lowest sockets (2.5 mm class,
  center: { x: -58.0, y: 11.7 } # Mill-Max 315 or conthrough): nothing lies between the controller and the PCB any more.
  rotation: 0                   # USB connector towards the top (away from the user). The centre is the hole pattern's
  size: { x: 18.0, y: 33.5 }    # centre; the board itself sits 0.6 mm further up (pcb_offset_y).
  pcb_offset_y: -0.6            # controller board centre relative to the hole pattern centre
  usb_shell: 0.6                # USB-C shell past the controller's own board edge (34.1 mm overall vs 33.5 mm board)
  usb_overhang: 1.5             # USB-C shell past the main PCB edge: the controller block's top edge is derived from this
  pin_pitch: 2.54
  row_spacing: 15.24            # 2 x 7.62
  socket_height: 2.5            # design value for the stack (controller PCB underside above the main PCB top)

# Battery: one PKCELL LP552035 cell (350 mAh, JST-PH plug, protection circuit) per half, identical
# on both halves. The cell lies UNDER the PCB below the controller, in a well of the case floor (the
# "battery bay"). The back of the PCB carries nothing there except the right row of socket tails, so
# the bay is the same rectangle on both boards: it starts between the two controller hole rows and
# runs down to the reset button. The lead / PCM end points towards +y, where J3 (JST-PH, default)
# and the J2 pads sit. Any cell up to 20.5 x 37.5 x 7.2 mm fits (702025, 602025, 502030, 602030, 552035).
battery:
  cell: "LP552035"
  capacity_mah: 350
  size: { x: 20.5, y: 37.5, z: 5.7 }            # PKCELL datasheet maxima incl. protection circuit
  bay: { center: { x: -53.9, y: 17.5 }, size: { x: 21.0, y: 41.0 } }   # on the back, x -64.4..-43.4, y -3..38
  depth_below_pcb: 6.5          # well floor below the PCB underside: solder joints 0.4 + Kapton 0.1 + 5.7 mm cell + 0.3 air
  edge_clearance: 1.5           # minimum distance from the bay to the PCB edge
  leads: "+y"                   # lead end towards J3 / J2

power_switch: { center: { x: -68.5, y: 30.0 }, rotation: 270 }  # MSK12C02, bottom side; 270 puts the actuator (local +y) at -x, through the inner edge
# EVQ-P7A is SIDE actuated: its plunger leaves the body at local +y. 270 turns it to -x like the
# power switch, 0.5 mm inside the inner edge, so a pin through a hole in the case wall presses it.
# (Until the 2026-11-12 review it sat at rotation 0 over a hole in the floor, which only reached
# the body of the switch.)
reset_button: { center: { x: -68.9, y: 41.0 }, rotation: 270 }  # bottom side, inner edge below the power switch
battery_pads: { center: { x: -57.0, y: 50.5 }, rotation: 0 }    # 2 x 1.7 mm PTH, 2.54 mm pitch, B+ / B-, below the JST (solder alternative)
battery_jst:  { center: { x: -56.0, y: 44.0 }, rotation: 0 }    # S2B-PH-SM4-TB, 6 mm tall, bottom side, default, below the battery bay (sits in the same well)

test_pads:                      # spare controller pins as 1.5 mm pads, in a row below the battery pads
  start: { x: -66.0, y: 57.5 }
  pitch: 2.5
  direction: x

mounting_holes:                 # M2 through holes for the case (2.2 mm), in the gaps between switches, both halves
  # The two holes between the ring and the pinky column sit where a 5.6 mm case standoff
  # clears the hot-swap sockets and the switch pegs on BOTH boards (the sockets point the other
  # way on the mirrored left board): 0.44 mm at best, and only at y = 12.1 + n x 17.
  - { x: 26.75, y: 12.1 }       # ring / pinky, between row 0 and row 1
  - { x: 26.75, y: 29.1, foot: false }   # ring / pinky, between row 1 and row 2; the foot stays at the corner
  - { x: -9.0,  y: 40.0 }       # middle / index, bottom
  - { x: -27.0, y: 8.0 }        # index / inner, top
# The fifth hole sits in the thumb cluster, whose shape differs per half since r2.3, so it is
# listed under halves.<side>.mounting_holes instead of here.

feet_extra:                     # rubber feet that are not under a mounting hole, both halves
  - { x: 27.0,  y: 44.5 }       # outer corner towards the user

stitching_vias:                 # GND vias tying the two pours together (free spots between switches), both halves
  - [27.0, 25.5]
  - [9.0, 6.0]
  - [-27.0, 25.0]
  - [-45.0, 31.5]
  - [-28.0, 48.5]
  - [28.5, 50.0]
  - [-64.5, 46.8]
  - [-70.0, 15.0]
  - [-33.0, 47.5]

outline:
  margin: 0.5                   # PCB edge outside the keycap rectangles
  socket_margin: 1.1            # extra width per side so the hot-swap socket pads (9.8 mm out) keep 0.3 mm to the edge
  corner_radius: 0.0            # r2: angular, 90 degree steps, no rounding (the fab's 1 mm router radius is accepted)
  controller_margin: 2.0

silkscreen:
  title: k0d3ball35
  revision_text: r2.4
  # Owner wordmark (spec/images/logo.svg, see NOTICE) on the back silkscreen, under the thumb
  # bridge. That band is the only place on either face that is clear of pads and of the other
  # silkscreen on both halves; the front is boxed in between the title text and the reset and
  # JST courtyards. cell is the stroke width, the mark is 18 x 35 cells, so 0.26 gives
  # 13.9 x 4.7 mm with 0.26 mm strokes - well above the 0.15 mm a fab can hold.
  logo:
    layer: B.SilkS
    cell: 0.26
    rotation: 90
    center: {x: -35.0, y: 48.4}

# Per-half data. Lists here are ADDED to the global ones (mounting_holes, stitching_vias);
# scalar blocks (trackball.center, fpc) exist only where given.
halves:
  left:
    # The hot-swap sockets of the inner column reach 2.8 mm into the bay on the left board
    # (issues/hw-left-bay-inner-sockets.md), so the cell lies under them: 1.85 + cell + 0.3 mm
    # must fit the 6.5 mm well. That is a 4 mm cell. The left half is the split peripheral and
    # draws far less than the central right half.
    battery:
      cell: "LP402025"
      capacity_mah: 150
      size: { x: 20.5, y: 26.5, z: 4.2 }          # 4.0 x 20 x 25 nominal, maxima incl. protection circuit
    thumbs: [thumb_outer, thumb_middle, thumb_inner]
    mounting_holes:
      - { x: -32.0, y: 61.0 }     # between the outer and the middle thumb key
    stitching_vias:
      - [-15.0, 65.0]
    # Hand-placed tracks for the rotated thumb cluster (the autorouter does not reach pads of
    # footprints rotated by 10/20 degrees). Points are layout coordinates or pad references:
    # "REF:joiner" = the switch's plated pin-1 joiner pad, "REF:pad2" / "REF:pad2f" = the switch's
    # socket pad 2 on the back / front face, "REF:bus" = bottom end of the column bus at this key,
    # "REF:1" / "REF:2" = diode pad 1 (cathode) / pad 2 (anode).
    # The left BOARD is the mirror image of the frame (x -> -x) while the footprints are not
    # mirrored, so pad references land on the mirrored side of their part and the free points
    # below are chosen for the left board, not copied from the right half.
    # Found with the same grid search as the right half (every drill, every pad and GND via of
    # another net, the board edge, the other hand routes and the thumb switches' own column pads
    # as obstacles), squared onto long runs with 45 degree corners. Points are layout-frame; the
    # left BOARD is their x mirror.
    manual_routes:
      - { net: SW34, layer: B.Cu, width: 0.25,   # 20 deg key: anode to socket pad 2 on the back
          points: ["D34:2", [-64.5, 72.5], [-71.0, 66.0], [-71.25, 65.75], "SW34:pad2"] }
      - { net: SW34, layer: F.Cu, width: 0.25,   # and the front copy of pad 2, around the far side of the switch
          points: ["D34:2", [-55.25, 66.25], "SW34:pad2f"] }
      - { net: ROW3, layer: B.Cu, width: 0.25,   # thumb diode chain, 0 deg key to 10 deg key
          points: ["D32:1", [-21.5, 67.0], "D33:1"] }
      - { net: ROW3, layer: B.Cu, width: 0.25,   # and on to the 20 deg key
          points: ["D33:1", [-42.0, 69.5], [-54.5, 69.5], [-56.25, 71.25], "D34:1"] }
      - { net: ROW3, layer: F.Cu, width: 0.25,   # controller to the thumb row, clear of the thumbs' own column pads
          points: ["U1:20", [-42.75, 38.25], [-42.75, 49.0], [-39.5, 52.25], [-39.5, 55.5], [-40.0, 56.0], [-40.0, 66.0], [-39.5, 66.5], "D33:1"] }
      - { net: COL2, layer: B.Cu, width: 0.25,   # middle column bus into the 0 deg key
          points: ["SW22:bus", [2.5, 28.5], [-6.75, 37.75], [-6.75, 40.0], [-11.25, 44.5], [-12.25, 44.5], "SW32:joiner"] }
      - { net: COL3, layer: B.Cu, width: 0.25,   # index column bus into the 10 deg key, past the stitching via at (-33, 47.5)
          points: ["SW23:bus", [-15.5, 30.75], [-24.75, 40.0], [-28.25, 40.0], "SW33:joiner"] }
      - { net: COL4, layer: B.Cu, width: 0.25,   # controller hole 11 to the inner column bus
          points: ["U1:11", [-43.25, 30.5], "SW24:bus"] }
      - { net: COL4, layer: B.Cu, width: 0.25,   # and on down to the 20 deg key
          points: ["SW24:bus", [-33.5, 32.75], [-34.5, 33.75], [-34.75, 34.0], [-54.0, 53.25], [-55.0, 53.25], [-55.75, 54.0], [-55.75, 55.0], [-58.75, 58.0], "SW34:joiner"] }
    test_pads:                      # nine pads on the left: one row below the battery pads, above the inner thumb key
      start: { x: -69.5, y: 54.5 }
  right:
    thumbs: [thumb_middle, thumb_inner]   # the outer position is the ball's since r2.3
    trackball:
      center: { x: -13.0, y: 66.0 }  # 5 mm outboard of the index column, 29.5 mm from the middle
                                     # thumb key: the band the reference designs land in once their
                                     # 34 mm ball is radius-corrected to 19.05 mm
    fpc:                            # sensor module FFC connector, KEY SIDE (r2.2): the cable climbs
                                    # the gap between the cradle cup and the notch, folds over the board
                                    # edge at y = 49 and enters the connector from +y, so the lock stays
                                    # reachable with everything assembled (spec/08-trackball-module.md).
      center: { x: -20.6, y: 47.0 }   # the FFC comes round the cup in the gap above the PCB and
                                      # folds over the edge into the connector. y keeps the mouth
                                      # inside the notch edge. r2.4 moved it 0.4 mm because the notch
                                      # grew to apothem 15.5; the index keycap edge is now 0.3 mm off
                                      # J1 but 3 mm above it, so the lock stays reachable
      rotation: 0
      side: top
      cable_length: 50              # 6-way 0.5 mm FFC, type B. The route from the module's FH19C through
                                    # the sleeve's end wall, round the cup into J1 is 34.4 mm including
                                    # both insertions (scripts/k0d3/ffc_route.py). No stocked cable lies
                                    # between 30 and 50 mm, so the 15.6 mm of slack goes into an S-fold
                                    # beside J1 (ffc_route.SLACK_ZONE)
    silkscreen:                   # the thumb bridge is shorter here, so the wordmark is smaller.
      logo:                       # The merge is shallow, so the whole block is repeated.
        layer: B.SilkS
        cell: 0.2                 # 0.2 mm is the thinnest stroke a fab holds
        rotation: 90                # above the thumb cluster: the bridge itself is full here (J1,
        center: { x: -40.0, y: 49.0 }   # the hand routes, H5). 1.9 mm to every pad, plated or not
    mounting_holes:
      - { x: -31.0, y: 49.0 }     # thumb bridge, left of the notch: the left half's spot (-32, 61)
                                  # is 0.3 mm from the edge here and everything further in is
                                  # either the battery well or a socket
    test_pads:                    # the global row at (-66, 57.5) lands on the inner thumb key's
      start: { x: -66.0, y: 45.0 }  # socket since r2.3. Down the inner edge instead, clear of the
      direction: y                  # controller box boss and with the TPn labels clear of J2
    stitching_vias: []          # the r2.2 spot (-14, 58) is inside the notch now and the strip
                                # left of it carries the wordmark; the 6 mm grid covers the bridge
    # The thumb pair is the middle (10 deg) and inner (20 deg) key since r2.3, so the right board
    # needs the same hand routes the left one needs, laid out for the unmirrored board.
    # Found with a grid search over the free copper of each layer (every drill, every pad of
    # another net, the board edge and the other hand routes as obstacles), then squared onto
    # long runs with 45 degree corners and verified independently; see the ticket.
    manual_routes:
      - { net: SW34, layer: B.Cu, width: 0.25,   # 20 deg key: anode to socket pad 2 on the back, past its pin hole
          points: ["D34:2", [-55.25, 68.25], "SW34:pad2"] }
      - { net: SW34, layer: F.Cu, width: 0.25,   # and the front copy of pad 2, around the far side of the switch
          points: ["D34:2", [-62.0, 71.25], [-66.5, 66.75], [-70.0, 66.75], "SW34:pad2f"] }
      - { net: ROW3, layer: B.Cu, width: 0.25,   # thumb diode chain, below the SW34 link
          points: ["D33:1", [-52.75, 67.5], [-57.5, 72.25], [-57.75, 72.5], "D34:1"] }
      - { net: ROW3, layer: F.Cu, width: 0.25,   # controller to the thumb row, west of the index column
          points: ["U1:20", [-46.5, 19.5], [-46.5, 56.75], [-44.25, 59.0], [-44.25, 64.25], [-42.75, 65.75], "D33:1"] }
      - { net: COL3, layer: B.Cu, width: 0.25,   # index column bus into the 10 deg key, left of J1
          points: ["SW23:bus", [-21.75, 28.25], [-25.25, 31.75], [-25.25, 35.5], [-33.0, 43.25], [-34.75, 43.25], [-45.0, 53.5], [-45.25, 53.75], "SW33:joiner"] }
      - { net: COL4, layer: B.Cu, width: 0.25,   # controller hole 11 to the inner column bus
          points: ["U1:11", [-58.25, 30.5], "SW24:bus"] }
      - { net: COL4, layer: B.Cu, width: 0.25,   # and on down to the 20 deg key, past J3 and between the battery and test pads
          points: ["SW24:bus", [-39.75, 30.5], [-58.5, 49.25], [-59.25, 49.25], [-59.5, 49.5], [-64.75, 54.75], [-64.75, 55.5], [-66.75, 57.5], "SW34:joiner"] }
